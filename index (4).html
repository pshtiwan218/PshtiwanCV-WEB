<style>
:root{--acc:#ff5a1f;--bg:#2f4a56;--bg2:#3a5865;--tx:#fff;--mut:#cfdde3;--card:rgba(255,255,255,.07);--bd:rgba(255,255,255,.14)}
[data-theme=light]{--bg:#eef3f5;--bg2:#e0e9ed;--tx:#1d2d34;--mut:#4d6671;--card:#fff;--bd:rgba(0,0,0,.1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{font-family:'Poppins','Noto Sans Arabic',sans-serif;background:var(--bg);color:var(--tx);line-height:1.7;overflow-x:hidden;transition:background .4s,color .4s}
[dir=rtl] body,[dir=rtl] button{font-family:'Noto Sans Arabic','Poppins',sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
header{position:fixed;inset:0 0 auto 0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 5%;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px)}
.logo{width:38px;height:38px;border:2px solid var(--acc);border-radius:50%;display:grid;place-items:center;color:var(--acc);font-weight:700;font-size:14px}
nav{display:flex;gap:22px;flex-wrap:wrap}
nav a{font-size:14px;font-weight:500;padding:2px 0;border-bottom:2px solid transparent;transition:.25s}
nav a:hover,nav a.on{color:var(--acc);border-color:var(--acc)}
.tools{display:flex;gap:8px;align-items:center}
.pill{border:1px solid var(--acc);background:transparent;border-radius:20px;padding:4px 12px;font-size:13px;transition:.25s}
.pill:hover,.pill.on{background:var(--acc);color:#fff}
section{min-height:100vh;padding:110px 7% 60px;display:flex;flex-direction:column;justify-content:center;position:relative}
h2{font-size:clamp(28px,4vw,40px);text-align:center;margin-bottom:36px}
h2 span,.acc{color:var(--acc)}
/* hero */
#home{flex-direction:row;align-items:center;justify-content:space-between;gap:40px;overflow:hidden}
.hero-t{max-width:560px;z-index:1}
.hero-t h3{font-size:clamp(20px,3vw,28px);font-weight:600}
.hero-t h1{font-size:clamp(34px,6vw,56px);line-height:1.2;margin:4px 0}
.role{font-size:clamp(20px,3vw,28px);font-weight:600;min-height:1.7em}
.role b{color:var(--acc);font-weight:700}
.role i{display:inline-block;width:2px;height:1em;background:var(--acc);vertical-align:-.12em;margin-inline-start:3px;animation:bl 1s steps(1) infinite}
.hero-t p{color:var(--mut);margin:14px 0 22px}
.soc{display:flex;gap:12px;margin-bottom:26px}
.soc a{width:40px;height:40px;border:2px solid var(--acc);border-radius:50%;display:grid;place-items:center;color:var(--acc);transition:.25s}
.soc a:hover{background:var(--acc);color:#fff;transform:translateY(-3px)}
.soc svg{width:18px;height:18px;fill:currentColor}
.btn{display:inline-block;background:var(--acc);color:#fff;border-radius:30px;padding:10px 30px;font-weight:600;box-shadow:0 0 18px color-mix(in srgb,var(--acc) 55%,transparent);transition:.25s}
.btn:hover{transform:translateY(-3px)}
.photo{position:relative;width:min(380px,70vw);aspect-ratio:1;flex:none;z-index:1}
.photo .disc{position:absolute;inset:6%;border-radius:50%;background:var(--acc);overflow:hidden;display:grid;place-items:center;font-size:90px;font-weight:700;color:#fff}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo .ring{position:absolute;inset:0;border-radius:50%;border:3px dashed var(--acc);opacity:.6;animation:spin 24s linear infinite}
.sh{position:absolute;border:2px solid var(--acc);opacity:.35;animation:fl 7s ease-in-out infinite}
.s1{width:70px;height:70px;border-radius:50%;top:18%;inset-inline-start:46%}
.s2{width:50px;height:50px;bottom:12%;inset-inline-start:8%;transform:rotate(20deg);animation-delay:-3s}
.s3{width:34px;height:34px;border-radius:50%;background:var(--acc);top:30%;inset-inline-end:4%;animation-delay:-5s}
/* about */
.about{max-width:880px;margin:auto;text-align:center}
.about p{color:var(--mut);margin-bottom:18px}
.deg{display:inline-block;border:1px solid var(--acc);border-radius:14px;padding:14px 26px;background:var(--card)}
.deg small{display:block;color:var(--acc);font-weight:600}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;max-width:1100px;margin:auto;width:100%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px;transition:.3s}
.card:hover{border-color:var(--acc);transform:translateY(-6px);box-shadow:0 10px 30px rgba(0,0,0,.18)}
.card h4{font-size:16px;margin-bottom:6px}
.card p{color:var(--mut);font-size:14px}
.yr{display:inline-block;direction:ltr;unicode-bidi:isolate;background:var(--acc);color:#fff;border-radius:12px;padding:0 12px;font-size:12px;margin-top:8px}
.alt{background:var(--bg2)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips span{border:1px solid var(--acc);border-radius:20px;padding:3px 16px;font-size:14px}
.card h3{color:var(--acc);margin-bottom:14px;font-size:18px}
.ct{max-width:700px;margin:auto;display:grid;gap:16px;width:100%}
.ct a,.ct div{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px 22px;transition:.3s}
.ct a:hover{border-color:var(--acc);transform:scale(1.02)}
.ct em{font-style:normal;width:42px;height:42px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none}
.ct bdi{direction:ltr;unicode-bidi:isolate}
footer{text-align:center;padding:20px;color:var(--mut);font-size:13px;border-top:1px solid var(--bd)}
/* motion */
.rv{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s}
.rv.in{opacity:1;transform:none}
.hero-t>*{animation:up .8s both}.hero-t>*:nth-child(2){animation-delay:.12s}.hero-t>*:nth-child(3){animation-delay:.24s}.hero-t>*:nth-child(4){animation-delay:.36s}.hero-t>*:nth-child(5){animation-delay:.48s}.hero-t>*:nth-child(6){animation-delay:.6s}
.photo{animation:pop 1s .2s both}
@keyframes up{from{opacity:0;transform:translateY(30px)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
@keyframes bl{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fl{50%{transform:translateY(-22px) rotate(30deg)}}
@media(max-width:820px){#home{flex-direction:column-reverse;text-align:center;justify-content:center}.soc{justify-content:center}nav{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>

["Assisted in educational and youth-related activities by helping organize workshops, seminars, and awareness campaigns, supporting learning opportunities, and encouraging active participation among young people in academic and community programs.","یارمەتیدەر بووم لە چالاکی پەروەردەیی و گەنجان بە ڕێکخستنی وۆرکشۆپ، سیمینار و کەمپەینی هۆشیارکردنەوە، پشتگیریکردنی دەرفەتی فێربوون و هاندانی گەنجان بۆ بەشداری چالاک لە پڕۆگرامی ئەکادیمی و کۆمەڵایەتی.","ساعدت في الأنشطة التعليمية والشبابية بتنظيم ورش عمل وندوات وحملات توعية ودعم فرص التعلم وتشجيع الشباب على المشاركة الفعالة في البرامج الأكاديمية والمجتمعية."],
["Gained three months of experience in managing professional training courses, language programs, and environmental activities, including planning schedules, coordinating participants, supporting trainers, monitoring activities, and ensuring the successful implementation of program objectives.","سێ مانگ ئەزموونم هەیە لە بەڕێوەبردنی خولی ڕاهێنانی پیشەیی، پڕۆگرامی زمان و چالاکی ژینگەیی، لەوانە داڕشتنی خشتە، هەماهەنگی بەشداربووان، پشتگیری ڕاهێنەران، چاودێری چالاکییەکان و دڵنیابوون لە جێبەجێکردنی ئامانجەکانی پڕۆگرام.","اكتسبت ثلاثة أشهر من الخبرة في إدارة الدورات التدريبية المهنية وبرامج اللغة والأنشطة البيئية، شملت وضع الجداول وتنسيق المشاركين ودعم المدربين ومتابعة الأنشطة وضمان تحقيق أهداف البرنامج."],
["Acquired four months of professional experience within an organization, working in communications, media relations, project coordination, and administrative support: assisting with internal and external communications, coordinating project activities, preparing reports and documents, organizing meetings, and supporting daily operations.","چوار مانگ ئەزموونی پیشەییم لە ڕێکخراوێک بەدەست هێناوە، لە بواری پەیوەندی، پەیوەندی میدیایی، هەماهەنگی پڕۆژە و پشتگیری کارگێڕی: یارمەتی پەیوەندی ناوخۆیی و دەرەکی، هەماهەنگی چالاکی پڕۆژە، ئامادەکردنی ڕاپۆرت و بەڵگە، ڕێکخستنی کۆبوونەوە و پشتگیری کاری ڕۆژانە.","اكتسبت أربعة أشهر من الخبرة المهنية داخل منظمة في مجالات الاتصال والعلاقات الإعلامية وتنسيق المشاريع والدعم الإداري: المساعدة في الاتصالات الداخلية والخارجية وتنسيق أنشطة المشاريع وإعداد التقارير والمستندات وتنظيم الاجتماعات ودعم العمليات اليومية."]
];

[["Received recognition on International Youth Day for efforts, care, and service dedicated to supporting and serving young people - Raparin Youth Organisation.","لە ڕۆژی نێودەوڵەتی گەنجان ڕێزلێنراوم بۆ هەوڵ، گرنگیپێدان و خزمەتکردنی گەنجان - ڕێکخراوی گەنجانی ڕاپەڕین.","تم تكريمي في اليوم الدولي للشباب تقديراً لجهودي ورعايتي وخدمتي لدعم الشباب - منظمة شباب رابرين."],"2025"],

const $=s=>document.querySelector(s);
let lang='en',ti=0,ci=0,del=false,timer;
function render(){
  const i=L.indexOf(lang);
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='en'?'ltr':'rtl';
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T[e.dataset.i][i]);
  $('#nav').innerHTML=NAV.map(n=>`<a href="#${n[0]}">${n[1][i]}</a>`).join('');
  $('#g_train').innerHTML=TR.map(c=>`<div class="card rv"><h4>${c[0][i]}</h4><p>${c[1][i]}</p><span class="yr">${c[2]}</span></div>`).join('');
  $('#g_exp').innerHTML=EX.map(e=>`<div class="card rv"><p>${e[i]}</p></div>`).join('');
  const ch=a=>`<div class="chips">${a.map(x=>`<span>${x}</span>`).join('')}</div>`;
  $('#g_skills').innerHTML=`<div class="card rv"><h3>${T.s_sk[i]}</h3>${ch(SK[i])}</div><div class="card rv"><h3>${T.s_sw[i]}</h3>${ch(SW)}</div><div class="card rv"><h3>${T.s_lg[i]}</h3>${ch(LG[i])}</div>`;
  $('#g_hon').innerHTML=HN.map(h=>`<div class="card rv"><p>${h[0][i]}</p><span class="yr">${h[1]}</span></div>`).join('');
  document.querySelectorAll('[data-l]').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  document.title=T.name[i];
  ti=0;ci=0;del=false;watch();
  try{localStorage.setItem('lang',lang)}catch(e){}
}
function type(){
  const w=ROLES[L.indexOf(lang)][ti];
  ci+=del?-1:1;
  $('#ty').textContent=w.slice(0,ci);
  let d=del?45:90;
  if(!del&&ci===w.length){del=true;d=1400}
  else if(del&&ci===0){del=false;ti=(ti+1)%4;d=300}
  clearTimeout(timer);timer=setTimeout(type,d);
}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
function watch(){document.querySelectorAll('.rv:not(.in)').forEach(e=>io.observe(e))}
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lang=b.dataset.l;render()});
function theme(t){document.documentElement.dataset.theme=t;$('#th').textContent=t==='dark'?'☀':'☾';try{localStorage.setItem('theme',t)}catch(e){}}
$('#th').onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');
try{lang=localStorage.getItem('lang')||'en';theme(localStorage.getItem('theme')||'dark')}catch(e){}
render();type();
const secs=[...document.querySelectorAll('section')];
addEventListener('scroll',()=>{let c='home';secs.forEach(s=>{if(scrollY>=s.offsetTop-160)c=s.id});document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+c))},{passive:true});
</script>
